name: Deploy to VPS

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy target
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "service=app" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "service=app-test" >> $GITHUB_OUTPUT
            echo "branch=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin
            git checkout ${{ steps.target.outputs.branch }}
            git pull origin ${{ steps.target.outputs.branch }}
            docker compose build ${{ steps.target.outputs.service }}
            docker compose up -d ${{ steps.target.outputs.service }}
            docker image prune -f
